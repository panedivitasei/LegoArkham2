; Toggles: 1 = on, 0 = off. Restart after editing.
[Display]
; Borderless window. 1 = on, 0 = off.
Borderless=1

[Compatibility]
; Optional renamed dinput8 proxy beside this DLL. Empty = system DirectInput.
ChainDinput8=

[Camera]
; Mod camera. Toggle in Control Setup (default F1).
Chase=1
; Camera distance: 25-400%. Vehicles use 1.5x this distance.
Distance=80
; Mouse camera control.
MouseLook=1
; Mouse look speed: 10-500%. Options menu overrides this.
MouseSensitivity=100
; Invert vertical mouse look.
InvertMouse=0
; Keep the camera clear of walls and water.
Collision=1

[Controls]
; Arkham keyboard defaults. Remap in Control Setup.
ArkhamKeys=1
; Use WASD in menus.
WasdMenus=1
; Switch input devices automatically.
DeviceSwitch=1

[Gameplay]
; Allow cutscene skipping.
SkipCutscenes=1
; Enable gliding for GlideCharacters.
Glide=1
; Character names, separated by commas.
GlideCharacters=Batman,Robin,Batgirl,BatgirlClassic
; Glide speed, percent of normal.
GlideSpeed=225
; Glide animation file.
GlideClip=LegoArkham2_glide.an4
; Optional troubleshooting log. 1 = on, 0 = off.
GlideClipLog=0
; Alternate glide animation. Empty = shared glide.
GlideOverrideClip=LegoArkham2_glide_robin.an4
; Characters using the alternate glide.
GlideOverrideCharacters=Robin
; Fall animation. Empty = original.
FallClip=
; Fall acceleration, percent of normal.
FallSpeed=70
; Animation blend time, milliseconds.
AnimEase=250
; Dive speed gain, percent per second.
DiveGain=60
; Maximum banked speed, percent.
DiveMax=150
; Banked speed loss, percent per second.
DiveDecay=40
; Dive descent speed, tenths of a world unit per second.
DiveDescent=80
; Forward dive speed, percent of glide speed.
DiveForward=0
; Pullout lift per 100% banked speed, tenths of a unit per second.
DiveLift=25
; Lift duration, tenths of a second.
DiveLiftTime=15
; Pullout duration, tenths of a second.
DivePullOut=8
; Dive transition duration, tenths of a second.
DiveTuckTime=4
; Transition sharpness: 10 = linear, 20 = smooth, 30 = sharp.
DiveCurve=30
; Transition front-loading: 0-100%.
DiveAttack=50
; Dive tilt, degrees downward.
DivePitch=60
; Pullout tilt, degrees upward.
DiveClimbPitch=12
; Looping dive sound file. Empty = none.
DiveSound=
; Glide opening sound file. Empty = none.
GlideOpenSound=
; Looping glide sound file. Empty = none.
GlideLoopSound=
; Cape sound volume: 0-1000.
CapeVolume=700
; Dive animation blend time, milliseconds.
DiveEase=500
; Remove the glide time limit.
GlideUnlimited=1
; Hold jump to glide after rolling, tenths of a second. 0 = disabled.
RollGlideHold=10
; Use the fall landing after a dive.
DiveLanding=1
; Dive animation file. Empty = disabled.
DiveClip=LegoArkham2_dive.an4
; Characters using the dive animation.
DiveClipCharacters=Batman,Robin,Batgirl,BatgirlClassic
; Pullout animation file. Empty = no transition clip.
PulloutClip=LegoArkham2_pullout.an4
; Animation slot used for pullout.
PulloutClipDonor=WhereDidHeGo
; Pullout animation frame count.
PulloutFrames=24
; Dive transition animation file. Empty = no transition clip.
TuckClip=LegoArkham2_tuck.an4
; Animation slot used for the dive transition.
TuckClipDonor=Whip_Pull_Pull
; Dive transition frame count.
TuckFrames=12
; Grapple to roof edges with GlideCharacters.
GrappleAnywhere=1
; Horizontal grapple range, world units.
GrappleRange=14
; Vertical grapple range, world units.
GrappleHeight=30
; Climb walls with GlideCharacters.
ClimbAnywhere=1
; Flash wall/ceiling running. Requires GrappleAnywhere.
FlashSurfaceRun=1
; Flash surface speed, tenths of a world unit per second.
FlashSurfaceSpeed=75
; Flash water running.
FlashWaterRun=1
; Water spray while Flash runs.
FlashWaterSplash=1
; Flash sprint jump height, percent of normal.
FlashSprintJump=300
; Hold jump to keep Flash rolling.
FlashRoll=1
; Allow held Flash rolls off ledges. Restart to apply.
FlashRollOffLedges=1
; 2 = wall climbing, 1 = repeated wall hops.
ClimbMode=2
; Wall grab distance, tenths of a world unit.
ClimbRange=12
; Required DirectInput scancode. 0 = no key required.
ClimbKey=0
; Climb speed: 25-400%. Requires FlashSurfaceRun.
ClimbSpeed=200
